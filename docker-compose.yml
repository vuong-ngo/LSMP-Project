# ============================================================================
# file: docker-compose.yml
# Description: Standalone Docker Compose configuration for LSMP AI Engine Node.
#              Designed for distributed deployment (connects to external DB).
# ============================================================================

services:
  # ===== LSMP AI Model Serving & Risk Engine =====
  lsmp-ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lsmp-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Connection to external PostgreSQL / TimescaleDB server on the network
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/lsmp_db}
      - MODEL_VERSION=${MODEL_VERSION:-cascade-v1.0}
      - MODEL_DIR=/app/models_store
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POLLING_INTERVAL_SECONDS=${POLLING_INTERVAL_SECONDS:-60}
      - RISK_ALPHA=${RISK_ALPHA:-0.6}
      - RISK_BETA=${RISK_BETA:-0.4}
    volumes:
      - ./models_store:/app/models_store
      - ./logs:/app/logs
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
