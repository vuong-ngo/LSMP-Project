# ============================================================================
# file: data_config.yaml
# Description: Configuration for Data Processing & 14 LSMP Feature Vectors
# ============================================================================

data:
  # 14 LSMP Feature columns used by the AI model (Auth & Nginx Core Schema)
  features:
    - auth_fail_count
    - auth_success_count
    - auth_fail_ratio
    - distinct_username
    - fail_interarrival_mean
    - fail_interarrival_std
    - http_req_rate
    - http_4xx_ratio
    - http_5xx_ratio
    - http_post_ratio
    - distinct_user_agent
    - bytes_sent_mean
    - global_active_ips
    - burst_rate

  # Time window for sliding-window feature aggregation (minutes)
  time_window_minutes: 1

  # Temporal split ratio matching SME-kit: Train (60%) / Validation (20%) / Test (20%)
  split: [0.6, 0.2, 0.2]
  train_test_split_ratio: 0.6

  # Database table name mappings (must match schema.sql)
  db_table_wazuh_alerts: "log_event"
  db_table_features: "feature_vectors"
  db_table_predictions: "risk_score"
  db_table_labels: "anomaly_result"

# File paths (used by build_features and data_loader)
raw_data_path: "data/raw"
processed_data_path: "data/processed"
external_data_path: "data/external"
train_ratio: 0.6
val_ratio: 0.2
test_ratio: 0.2
window_minutes: 60
feature_version: "v1"
