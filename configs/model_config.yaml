# ============================================================================
# file: model_config.yaml
# Description: Configuration for Isolation Forest, OCSVM, and Cascade Model
# Based on SME research experimental benchmarks.
# ============================================================================

# Default hyperparameters for Isolation Forest (Liu et al., 2008)
isolation_forest:
  n_estimators: 200
  max_samples: 256
  contamination: 0.02
  random_state: 42
  n_jobs: -1

# Default hyperparameters for One-Class SVM (Schölkopf et al.)
one_class_svm:
  kernel: "rbf"
  nu: 0.02
  gamma: "scale"

# Two-stage Cascade Model configuration
cascade:
  gate_rate: 0.20             # Default % most suspicious windows routed to Stage 2 (tuned on validation)
  w_stage1: 0.4               # Weight of Stage 1 in combined score fusion
  uncertainty_margin: 0.0     # Uncertainty band width for Three-Way Decision (0.0 to disable arbitrary abstention)
  model_version: "cascade-v1.0"

# Operational threshold selection (calibrated on validation set)
threshold:
  criterion: "fpr_budget"     # f1 | f2 | fpr_budget
  max_fpr: 0.02               # False positive budget aligned with SME SOC daily alert capacity

# Hyperparameter search grids (used during grid search tuning)
grid_search:
  iforest:
    n_estimators: [100, 200]
    max_samples: [256, 512]
  ocsvm:
    kernel: ["rbf"]
    nu: [0.01, 0.02, 0.05]
    gamma: ["scale", 0.01, 0.1]
  cascade:
    gate_rate: [0.20, 0.30, 0.50, 1.00]
    w_stage1: [0.2, 0.4, 0.6]

model_store_path: "models_store"
