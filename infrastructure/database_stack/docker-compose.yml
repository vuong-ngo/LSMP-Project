# ============================================================================
# file: docker-compose.yml
# description: Docker Compose file for setting up a PostgreSQL database with TimescaleDB extension.
# ============================================================================

services:
  # ===== PostgreSQL - TimescaleDB Service Configuration =====
  lsmp-postgres:
    image: timescale/timescaledb:${VERSION_POSTGRES:-latest-pg15}
    container_name: lsmp-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-lsmp_db}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      # Storage data
      - postgresql_data:/var/lib/postgresql/data
      # Init database (executed in alphabetical order on first run)
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./grant_least_privilege.sql:/docker-entrypoint-initdb.d/02_grant_least_privilege.sql
    networks:
      - lsmp_backend
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1GB
      -c max_connections=100
      -c timescaledb.max_background_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  lsmp_backend:
    name: lsmp_backend

volumes:
  postgresql_data:
