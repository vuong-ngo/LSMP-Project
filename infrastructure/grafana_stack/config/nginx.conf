# ============================================================================
# file: nginx.conf
# Description: Nginx reverse proxy configuration with TLS termination for Grafana Loki.
# ============================================================================

# ====== Worker & Process Configuration ======
user  nginx;
worker_processes  5;

# ====== Events Configuration ======
events {
  worker_connections   1000;
}

# ====== HTTP Proxy & TLS Gateway Configuration ======
http {
  resolver 127.0.0.11;

  # ====== Server Configuration ======
  server {
    # Port 3100: TLS/HTTPS for Fluent-bit clients & external access
    listen             3100 ssl;
    # Port 3101: Plain HTTP fallback for internal stack services (Grafana/Alloy)
    listen             3101;

    # ====== TLS Certificates & Ciphers ======
    ssl_certificate     /etc/nginx/certs/loki_gateway.crt;
    ssl_certificate_key /etc/nginx/certs/loki_gateway.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ====== Health Check Endpoint ======
    location = / {
      return 200 'OK';
      auth_basic off;
    }

    # ====== Prometheus Legacy Push Endpoint ======
    location = /api/prom/push {
      proxy_pass       http://write:3100$request_uri;
    }

    # ====== Prometheus Legacy Tail Endpoint ======
    location = /api/prom/tail {
      proxy_pass       http://read:3100$request_uri;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # ====== Prometheus Legacy General Query Endpoint ======
    location ~ /api/prom/.* {
      proxy_pass       http://read:3100$request_uri;
    }

    # ====== Loki Native v1 Push Endpoint ======
    location = /loki/api/v1/push {
      proxy_pass       http://write:3100$request_uri;
    }

    # ====== Loki Native v1 Tail Endpoint ======
    location = /loki/api/v1/tail {
      proxy_pass       http://read:3100$request_uri;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # ====== Loki Native v1 General Query Endpoint ======
    location ~ /loki/api/.* {
      proxy_pass       http://read:3100$request_uri;
    }
  }
}
