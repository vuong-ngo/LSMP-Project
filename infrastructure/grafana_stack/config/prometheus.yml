# ============================================================================
# file: prometheus.yml
# Description: Prometheus Server configuration to scrape host metrics (Node Exporter).
# ============================================================================

# ====== Global Configuration ======
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# ====== Scrape Configurations ======
scrape_configs:
  # ====== Scrape Job: Host Node Exporter (CPU, RAM, Disk, Network metrics) ======
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ====== Scrape Job: Alloy Process Metrics ======
  - job_name: 'alloy_metrics'
    static_configs:
      - targets: ['alloy:12345']
