// ============================================================================
// file: alloy-local-config.yaml
// Description: Grafana Alloy configuration for collecting Host Metrics (CPU, RAM, Disk, Net)
//              and Remote Writing to Prometheus Server + Shipping Logs to Loki.
// ============================================================================

// ====== Host Metrics Exporter (Node / Unix Exporter) ======
prometheus.exporter.unix "host" {
  procfs_path = "/host/proc"
  sysfs_path  = "/host/sys"
  rootfs_path = "/host/root"
}

// ====== Scrape Unix Exporter Targets inside Alloy ======
prometheus.scrape "host_scrape" {
  targets    = prometheus.exporter.unix.host.targets
  forward_to = [prometheus.remote_write.default.receiver]
}

// ====== Remote Write Metrics to Prometheus Server ======
prometheus.remote_write "default" {
  endpoint {
    url = "http://prometheus:9090/api/v1/write"
  }
}

// ====== Docker Container Log Discovery & Relabeling ======
discovery.docker "flog_scrape" {
  host             = "unix:///var/run/docker.sock"
  refresh_interval = "5s"
}

discovery.relabel "flog_scrape" {
  targets = []

  rule {
    source_labels = ["__meta_docker_container_name"]
    regex         = "/(.*)"
    target_label  = "container"
  }
}

// ====== Docker Container Log Source (Loki Source) ======
loki.source.docker "flog_scrape" {
  host             = "unix:///var/run/docker.sock"
  targets          = discovery.docker.flog_scrape.targets
  forward_to       = [loki.write.default.receiver]
  relabel_rules    = discovery.relabel.flog_scrape.rules
  refresh_interval = "5s"
}

// ====== Host Auth Log File Matcher (/var/log/auth.log) ======
local.file_match "auth_log_files" {
  path_targets = [{"__path__" = "/var/log/auth.log"}]
}

// ====== Host Auth Log Source (Loki Source) ======
loki.source.file "auth_logs" {
  targets    = local.file_match.auth_log_files.targets
  forward_to = [loki.write.default.receiver]
}

// ====== Loki Remote Write Receiver ======
loki.write "default" {
  endpoint {
    url       = "http://gateway:3101/loki/api/v1/push"
    tenant_id = "tenant1"
  }
  external_labels = {}
}
