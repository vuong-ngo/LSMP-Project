# ============================================================================
# file: grafana-datasources.yaml
# Description: Grafana datasource provisioning for Loki (HTTPS) and Prometheus.
# ============================================================================

apiVersion: 1

# ====== Grafana Data Sources Configuration ======
datasources:
  # ====== Loki Data Source (HTTPS with TLS Skip Verify) ======
  - name: Loki
    type: loki
    access: proxy
    url: https://gateway:3100
    jsonData:
      tlsSkipVerify: true
      httpHeaderName1: "X-Scope-OrgID"
    secureJsonData:
      httpHeaderValue1: "tenant1"

  # ====== Prometheus Data Source (Internal Metrics) ======
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
