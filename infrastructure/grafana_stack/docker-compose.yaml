# ============================================================================
# file: docker-compose.yaml
# Description: Docker Compose configuration for Grafana Loki distributed stack.
#              Includes Loki Read/Write/Backend, SeaweedFS, Prometheus, Node Exporter,
#              Grafana, Alloy, and Nginx Gateway with TLS.
# ============================================================================

---
# ====== Networks Configuration ======
networks:
  loki:

# ====== Services Configuration ======
services:
  # ====== Loki Read Service (Query Engine) ======
  read:
    image: grafana/loki:${LOKI_VERSION:-latest}
    command: "-config.file=/etc/loki/config.yaml -target=read"
    restart: unless-stopped
    expose:
      - "3100"
      - "7946"
      - "9095"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - seaweedfs
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      loki:
        aliases:
          - loki

  # ====== Loki Write Service (Ingester & Distributor) ======
  write:
    image: grafana/loki:${LOKI_VERSION:-latest}
    command: "-config.file=/etc/loki/config.yaml -target=write"
    restart: unless-stopped
    expose:
      - "3100"
      - "7946"
      - "9095"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - seaweedfs
    networks:
      <<: *loki-dns

  # ====== Grafana Alloy (Telemetry Collector & Shipper) ======
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.2.1}
    container_name: alloy
    restart: unless-stopped
    pid: host
    volumes:
      - ./config/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/log:/var/log:ro
      - /run/udev:/run/udev:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    expose:
      - "12345"
    depends_on:
      - gateway
    networks:
      - loki

  # ====== SeaweedFS (S3 Object Storage for Loki Chunks & Indexes) ======
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-latest}
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json"
    ports:
      - "8888:8888"  # SeaweedFS Filer Web UI
    expose:
      - "8333"
      - "9333"
    volumes:
      - data_seaweedfs:/data
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9333/dir/status || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - loki

  # ====== Node Exporter (Host System Metrics Exporter) ======
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.8.0}
    container_name: node-exporter
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    expose:
      - "9100"
    networks:
      - loki

  # ====== Prometheus Server (Metrics Collection & Storage) ======
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.51.1}
    container_name: prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    expose:
      - "9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - loki

  # ====== Grafana (Visualization Platform & Dashboards) ======
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - gateway
      - prometheus
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki

  # ====== Loki Backend Service (Compactor, Ruler & Index Gateway) ======
  backend:
    image: grafana/loki:${LOKI_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml
    expose:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    depends_on:
      - gateway
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - loki
    
  # ====== Nginx Gateway (Reverse Proxy & TLS Termination) ======
  gateway:
    image: nginx:${NGINX_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - read
      - write
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki
  
  # ====== Flog (Synthetic Log Generator for Testing) ======
  flog:
    image: mingrammer/flog:${FLOG_VERSION:-latest}
    restart: unless-stopped
    command: -f json -d 200ms -l
    networks:
      - loki

# ====== Persistent Storage Volumes ======
volumes:
  data_seaweedfs:
