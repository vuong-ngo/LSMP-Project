# ============================================================================
# file: docker-compose.yml
# Description: Docker Compose configuration for Grafana Loki.
# ============================================================================

---
networks:
  loki:

services:
  # ===== Read Service: Query Frontend (Servicediscovery-compatible) =====
  read:
    image: grafana/loki:${LOKI_VERSION:-3.7.3}
    command: "-config.file=/etc/loki/config.yaml -config.expand-env=true -target=read"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-loki}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-supersecret}
    ports:
      - 3101:3100
      - 7946
      - 9095
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      loki:
        aliases:
          - loki

  # ===== Write Service: Ingestion & Indexing =====
  write:
    image: grafana/loki:${LOKI_VERSION:-3.7.3}
    command: "-config.file=/etc/loki/config.yaml -config.expand-env=true -target=write"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-loki}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-supersecret}
    ports:
      - 3102:3100
      - 7946
      - 9095
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      <<: *loki-dns

  # ===== Agent Service: Grafana Alloy (Agent for log collection) =====
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.7.1}
    volumes:
      - ./config/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - 12345:12345
    depends_on:
      - gateway
    networks:
      - loki

  # ===== Storage Service: MinIO Object Storage =====
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z-cpuv1}
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-loki}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-supersecret}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - 9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - loki

  # ===== Visualization Service: Grafana =====
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - gateway
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://gateway:3100
            jsonData:
              httpHeaderName1: "X-Scope-OrgID"
            secureJsonData:
              httpHeaderValue1: "tenant1"
        EOF
        /run.sh
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki

  # ===== Backend Service: Index store (Service Discovery - compatible) =====
  backend:
    image: grafana/loki:${LOKI_VERSION:-3.7.3}
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-loki}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-supersecret}
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml
    ports:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -config.expand-env=true -target=backend -legacy-read-mode=false"
    depends_on:
      - minio
      - gateway
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - loki

  # ===== Ingress Service: Nginx (Loki Service Discovery) =====
  gateway:
    image: nginx:${NGINX_VERSION:-1.27.4-alpine}
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;
        worker_processes  5;  ## Default: 1

        events {
          worker_connections   1000;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki

  # ===== Test Service: Flog (Log Generator) =====
  flog:
    image: mingrammer/flog:${FLOG_VERSION:-0.4.3}
    command: -f json -d 200ms -l
    networks:
      - loki

volumes:
  minio_data:
