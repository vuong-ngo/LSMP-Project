# ============================================================================
# file: docker-compose.yaml
# description: Docker Compose file for setting up Grafana Loki distributed service.
# ============================================================================

---
networks:
  loki:

services:
  # ===== Grafana Loki Distributed Service Configuration =====
  read:
    image: grafana/loki:${LOKI_VERSION:-latest}
    command: "-config.file=/etc/loki/config.yaml -target=read"
    restart: unless-stopped
    expose:
      - "3100"
      - "7946"
      - "9095"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      loki:
        aliases:
          - loki

  # ===== Grafana Loki Distributed Service Configuration =====
  write:
    image: grafana/loki:${LOKI_VERSION:-latest}
    command: "-config.file=/etc/loki/config.yaml -target=write"
    restart: unless-stopped
    expose:
      - "3100"
      - "7946"
      - "9095"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      <<: *loki-dns

  # ===== Grafana Alloy Service Configuration =====
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.2.1}
    container_name: alloy
    restart: unless-stopped
    pid: host
    volumes:
      - ./config/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/log:/var/log:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    expose:
      - "12345"
    depends_on:
      - gateway
    networks:
      - loki

  # ===== MinIO Service Configuration =====
  minio:
    image: quay.io/minio/minio:${MINIO_VERSION:-RELEASE.2024-06-06T09-36-42Z}
    restart: unless-stopped
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    expose:
      - "9000"
    volumes:
      - data_minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - loki

  # ===== Node Exporter Service Configuration =====
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.8.0}
    container_name: node-exporter
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    expose:
      - "9100"
    networks:
      - loki

  # ===== Prometheus Service Configuration =====
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.51.1}
    container_name: prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    expose:
      - "9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - loki

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - gateway
      - prometheus
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki

  # ===== Grafana Loki Distributed Service Configuration =====
  backend:
    image: grafana/loki:${LOKI_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml
    expose:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    depends_on:
      - gateway
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - loki
    
  # ===== Nginx Gateway Service Configuration =====
  gateway:
    image: nginx:${NGINX_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - read
      - write
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki
  
  # ===== Flog Service Configuration =====
  flog:
    image: mingrammer/flog:${FLOG_VERSION:-latest}
    restart: unless-stopped
    command: -f json -d 200ms -l
    networks:
      - loki

volumes:
  data_minio: