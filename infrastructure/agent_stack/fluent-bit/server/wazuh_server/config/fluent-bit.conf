# ============================================================================
# file: fluent-bit.conf
# description: Fluent-Bit configuration for Wazuh Server (Server A).
#              Tails Wazuh alert logs and forwards them to the remote
#              HTTP Ingest Receiver on the Database Server (Server B).
# ============================================================================

# ====== SERVICE ======
[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ====== INPUT ======
# Wazuh alerts in JSON format (generated by Wazuh Manager analysisd)
[INPUT]
    Name             tail
    Path             /var/ossec/logs/alerts/alerts.json
    Parser           json
    Tag              wazuh.alert
    DB               /fluent-bit/db/wazuh_alerts.db
    Buffer_Max_Size  5MB
    Mem_Buf_Limit    50MB
    Skip_Long_Lines  On

# ====== FILTER ======
# Inject metadata into each record for traceability
[FILTER]
    Name             record_modifier
    Match            wazuh.alert
    Record           hostname ${HOSTNAME}
    Record           agent_type fluent-bit-wazuh-server

# ====== OUTPUT ======
# Forward to the HTTP Ingest Receiver on the Database Server (Server B)
[OUTPUT]
    Name             http
    Match            wazuh.alert
    Host             ${INGEST_HOST}
    Port             ${INGEST_PORT}
    URI              /ingest
    Format           json_lines
    tls              ${ENABLE_TLS}
    tls.verify       ${TLS_VERIFY}
    tls.ca_file      /fluent-bit/certs/ca.crt
    Header           X-Ingest-Token ${INGEST_TOKEN}
