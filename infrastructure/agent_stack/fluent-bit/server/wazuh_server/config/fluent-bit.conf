# ============================================================================
# file: fluent-bit.conf
# description: configuration file for fluent-bit on the wazuh server to forward logs to LSMP database server
# ============================================================================

# ====== SERVICE ======
[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ====== INPUT ======
# Wazuh Manager alerts
[INPUT]
    Name             tail
    Path             /var/ossec/logs/alerts/alerts.json
    Parser           json
    Tag              wazuh.alerts
    DB               /fluent-bit/db/alerts_offset.db
    Refresh_Interval 1
    Buffer_Max_Size  10MB
    Mem_Buf_Limit    50MB
    Skip_Long_Lines  On

# ====== OUTPUT ======
# Output to LSMP database server via HTTP
[OUTPUT]
    Name             http
    Match            wazuh.alerts
    Host             ${INGEST_HOST}
    Port             ${INGEST_PORT}
    URI              /ingest
    Format           json_lines
    Json_Date_Key    timestamp
    Json_Date_Format iso8601
    Header           Content-Type application/x-ndjson
    Header           X-Ingest-Token ${INGEST_TOKEN}
    tls              ${ENABLE_TLS}
    tls.verify       ${TLS_VERIFY}
    tls.ca_file      /fluent-bit/certs/ca.crt
    Retry_Limit      False
    workers          2


