# ============================================================================
# file: fluent-bit.conf
# description: configuration file for fluent-bit client logs forward to Grafana Loki and Wazuh Manager
# ============================================================================

# ====== SERVICE ======
[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ====== INPUT ======
# auth.log: authentication logs
[INPUT]
    Name             tail
    Path             /var/log/auth.log
    Tag              client.auth
    DB               /fluent-bit/db/auth_logs.db
    Buffer_Max_Size  5MB
    Mem_Buf_Limit    50MB
    Skip_Long_Lines  On

# nginx/access.log: web logs
# [INPUT]
#     Name             tail
#     Path             /var/log/nginx/access.log
#     Parser           nginx
#     Tag              client.nginx
#     DB               /fluent-bit/db/nginx_logs.db
#     Buffer_Max_Size  5MB
#     Mem_Buf_Limit    50MB
#     Skip_Long_Lines  On

# ====== FILTER ======
# Inject static tags/metadata into the records
[FILTER]
    Name             record_modifier
    Match            *
    Record           hostname ${CLIENT_HOSTNAME}
    Record           environment ${ENV}
    Record           agent_type fluent-bit-client

# ====== OUTPUT ======
# Output to Grafana Loki
# [OUTPUT]
#     Name             loki
#     Match            client.nginx
#     Host             ${LOKI_HOST}
#     Port             ${LOKI_PORT}
#     Labels           job=nginx, hostname=${CLIENT_HOSTNAME}, env=${ENV}
#     Line_Format      json

[OUTPUT]
    Name             loki
    Match            client.auth
    Host             ${LOKI_HOST}
    Port             ${LOKI_PORT}
    Labels           job=auth, hostname=${CLIENT_HOSTNAME}, env=${ENV}
    Line_Format      json

# Output to wazuh manager (via TCP Syslog 514)
[OUTPUT]
    Name                    syslog
    Match                   *
    Host                    ${WAZUH_HOST}
    Port                    ${WAZUH_PORT}
    Mode                    tcp
    Syslog_Format           rfc3164
    syslog_appname_preset   lsmp-client
    syslog_hostname_preset  ${CLIENT_HOSTNAME}
    syslog_message_key      log